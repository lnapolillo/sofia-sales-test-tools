#Application base configuration. This properties will not be overridden and will be shared for every environment.
#For overridable properties, put them in the environment.properties file

app.version=@project.version@
maven.build.timestamp=@maven.build.timestamp@
project.artifactId=@project.artifactId@

app.api-doc.title=Java Template ${environment.name}
app.api-doc.description=Template de una aplicacion escrita en Java con uso de practicas recomendadas en Despegar
app.api-doc.contact.name=Comite Tech
app.api-doc.contact.email=comite-tech@despegar.com
app.api-doc.contact.url=https://github.com/orgs/despegar/teams/java-template-maintainers/members

springdoc.swagger-ui.document-title=${app.api-doc.title}

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Server
server.jetty.port=9292
server.max-http-request-header-size=200000
server.servlet.context-path=/
#server.jetty.thread-pool.executor.name=jetty-thread-pool
#server.jetty.thread-pool.executor.maximum-pool-size=240
#server.jetty.thread-pool.executor.core-pool-size=120
#server.jetty.thread-pool.executor.keep-alive-time=60000
#server.jetty.thread-pool.executor.queue.linked.capacity=1000
server.jetty.thread-pool.queued.name=jetty-thread-pool
server.jetty.thread-pool.queued.max-threads=2000
server.jetty.thread-pool.queued.min-threads=1
server.jetty.thread-pool.queued.idle-timeout=60000
server.jetty.thread-pool.queued.use-virtual-threads=true
server.jetty.thread-pool.queued.queue.linked.capacity=1

#ThreadPools
thread-pool.notifier.schedule-in-seconds=10
#thread-pool.executors.example.name=example-thread-pool
#thread-pool.executors.example.maximum-pool-size=20
#thread-pool.executors.example.core-pool-size=10
#thread-pool.executors.example.keep-alive-time=60000
#thread-pool.executors.example.queue.linked.capacity=1000

#Metrics
management.endpoints.web.exposure.include=metrics,prometheus
management.endpoint.metrics.access=unrestricted
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

jfr.pinned-vts.lifecycle.stream-event-max-age=10s
jfr.pinned-vts.handler.stack-trace-max-depth=50
jfr.pinned-vts.handler.report-prometheus-metrics=true
jfr.pinned-vts.handler.report-new-relic-metrics=false # habilitar solo si es estrictamente necesario

routing.static.paths.to.exclude=/health-check,/actuator/prometheus,/favicon.ico,/swagger-ui/index.html,/swagger-ui/swagger-initializer.js,/swagger-ui/swagger-ui.css,/v3/api-docs/swagger-config,/v3/api-docs

