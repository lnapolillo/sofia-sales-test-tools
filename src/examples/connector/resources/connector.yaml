geo:
  rest-connector:
    host: backend.us-east-1.despegar.net
    read-timeout: 2s
    json:
      format: SNAKE_CASE
  resources:
    countries:
      name: countries
      method: GET
      encoding: GZIP
      media-type: application/json
      path: /v3/countries
      params:
        product: FLIGHTS
    country-by-id:
      name: country-by-id
      method: GET
      encoding: GZIP
      media-type: application/json
      path: /v3/countries/{id}
      response-timeout: 2s
      params:
        product: FLIGHTS
